    # Calendarios (Streamlit): proxy WebSocket para el canal de la app.
    #Debe ir ANTES del ProxyPass genérico de "/", para que Apache
    # capture /_stcore/stream con upgrade a websocket.
    ProxyPass        /_stcore/stream  ws://192.168.1.140:8501/_stcore/stream
    ProxyPassReverse /_stcore/stream  ws://192.168.1.140:8501/_stcore/stream
